name: Build and Push Docker Image

on:
  push:
    branches:
      - main

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
    - name: Step 1 - Get my code
      uses: actions/checkout@v3

    - name: Step 2 - Login to Docker Hub
      uses: docker/login-action@v2
      with:
        username: ${{ secrets.DOCKER_USERNAME }}
        password: ${{ secrets.DOCKER_PASSWORD }}

    - name: Step 3 - Build Docker image
      run: docker build -t ${{ secrets.DOCKER_USERNAME }}/karthik-app:latest .

    - name: Step 4 - Push to Docker Hub
      run: docker push ${{ secrets.DOCKER_USERNAME }}/karthik-app:latest

    - name: Step 5 - Done!
      run: echo "Image pushed successfully to Docker Hub!"


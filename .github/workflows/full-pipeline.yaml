name: Full CI/CD Pipeline

on:
  push:
    branches:
      - main

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
    - name: Step 1 - Get code
      uses: actions/checkout@v3
    - name: Step 2 - Loging to Docker
      uses: docker/login-action@v2
      with:
        username: ${{ secrets.DOCKER_USERNAME }}
        password: ${{ secrets.DOCKER_PASSWORD }}
    - name: Step 3 - Build Docker Image
      run: |
        docker build -t ${{ secrets.DOCKER_USERNAME }}/karthik-app:latest .
        docker build -t ${{ secrets.DOCKER_USERNAME }}/karthik-app:${{ github.sha }} .
    - name: Step 4 - Push to Docker Hub
      run: |
        docker push ${{ secrets.DOCKER_USERNAME }}/karthik-app:latest
        docker push ${{ secrets.DOCKER_USERNAME }}/karthik-app:${{ github.sha }}
    - name: Step 5 - Login to GCP
      uses: google-github-actions/auth@v1
      with:
        credentials_json: ${{ secrets.GCP_CREDENTIALS }}
    - name: Step 6 - Connect to GKE
      uses: google-github-actions/get-gke-credentials@v1
      with:
        cluster_name: ${{ secrets.GKE_CLUSTER_NAME }}
        location: ${{ secrets.GKE_ZONE }}
    - name: Step 7 - Deploy to GKE
      run: |
        kubectl apply -f k8s-deployment.yaml
        kubectl set image deployment/karthik-app karthik-app=${{ secrets.DOCKER_USERNAME }}/karthik-app:${{ github.sha }}
        kubectl rollout status deployment/karthik-app
    - name: Step 8 - Get app URL
      run: |
        echo "Waiting for external IP..."
        kubectl get service karthik-app-service


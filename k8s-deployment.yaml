apiVersion: apps/v1
kind: Deployment
metadata:
  name: karthik-app
spec:
  replicas: 2
  selector:
    matchLabels:
	app: karthik-app
  template:
    metadata:
	labels:
	  app: karthik-app
    spec:
      containers:
      - name: karthik-app
	image: karthik1082/karthik-app
	ports:
	- containerPort: 80
---

apiVersion: v1
kind: Service
metadata:
  name: karthik-app-service
spec:
  selector:
    app: karthik-app
  ports:
  - port: 80
    targetPort: 80
  type: LoadBalancer
